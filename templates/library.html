<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Library — TNxBD Studio</title>
    <meta name="description" content="Browse 868+ AI voices with name, description and voice ID. Search by name, ID or description and filter by gender, language and tag. Copy any voice ID for the TTS API." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/static/favicon.gif" type="image/gif" />
    <link rel="canonical" href="https://speakee.tnxbd.top/library" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Voice Library — TNxBD Studio" />
    <meta property="og:description" content="Search and filter 868+ AI voices by name, ID, gender, language and tag. Copy voice IDs for the TTS API." />
    <meta property="og:url" content="https://speakee.tnxbd.top/library" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/tailwind.css" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        var dark = (t === 'dark') || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      @keyframes libGlow { 0%,100%{filter:drop-shadow(0 0 0 rgba(99,102,241,0))} 50%{filter:drop-shadow(0 0 5px rgba(99,102,241,.55))} }
      .lib-ico { animation: libGlow 3.2s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner { width:14px; height:14px; border:2px solid rgba(99,102,241,.3); border-top-color:#6366f1; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
      @media (prefers-reduced-motion: reduce) { .lib-ico { animation: none !important; } html { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen">
  <a href="#main" class="sr-only focus:not-sr-only" style="position:fixed;top:12px;left:12px;z-index:60;background:#fff;color:#4338ca;padding:8px 16px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15)">Skip to content</a>
    <nav class="sticky top-0 z-40 backdrop-blur bg-white/80 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800">
      <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
          <svg class="w-7 h-7 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v3"/></svg>
          <span class="font-extrabold text-lg tracking-tight">TNxBD <span class="text-brand-500">Studio</span></span>
        </a>
        <div class="flex items-center gap-2">
          <a href="/" aria-label="Home" class="group inline-flex items-center gap-1.5 text-slate-600 dark:text-slate-300 hover:text-brand-600 px-2 sm:px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
            <svg class="lib-ico w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="hidden sm:inline text-sm font-medium">Home</span>
          </a>
          <button id="themeBtn" class="w-9 h-9 grid place-items-center rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer" aria-label="Toggle theme">
            <svg id="iconMoon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round"/></svg>
            <svg id="iconSun" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </nav>

    <main id="main" class="max-w-5xl mx-auto px-4 py-8">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Voice Library</h1>
      <p class="mt-2 text-slate-600 dark:text-slate-400">Browse <span id="totalCount" class="font-semibold text-slate-700 dark:text-slate-200">—</span> AI voices. Search by name, ID or description, filter by gender, language and tag, then copy any voice ID for the TTS API.</p>

      <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-[1.6fr_1fr_1fr_1fr] gap-3 items-end">
        <div>
          <label for="search" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Search</label>
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
            <input id="search" type="text" placeholder="Name, ID, description or keyword…" autocomplete="off" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2.5 pl-9 text-sm focus:ring-2 focus:ring-brand-400 outline-none" />
          </div>
        </div>
        <div>
          <label for="fGender" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Gender</label>
          <div class="relative">
            <select id="fGender" class="appearance-none w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2.5 pr-9 text-sm focus:ring-2 focus:ring-brand-400 outline-none cursor-pointer"></select>
            <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div>
          <label for="fLang" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Language</label>
          <div class="relative">
            <select id="fLang" class="appearance-none w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2.5 pr-9 text-sm focus:ring-2 focus:ring-brand-400 outline-none cursor-pointer"></select>
            <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div>
          <label for="fTag" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Tag</label>
          <div class="relative">
            <select id="fTag" class="appearance-none w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2.5 pr-9 text-sm focus:ring-2 focus:ring-brand-400 outline-none cursor-pointer"></select>
            <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        <button id="chipAll" type="button" class="cursor-pointer text-sm font-semibold px-3 py-1.5 rounded-full border transition-colors" aria-pressed="true">All</button>
        <button id="chipFav" type="button" class="cursor-pointer text-sm font-semibold px-3 py-1.5 rounded-full border transition-colors" aria-pressed="false">
          <span class="inline-flex items-center gap-1"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 6.9 20.4l1.4-6.8L3.2 9l6.9-.7z"/></svg> Favorites</span>
        </button>
        <button id="chipOwned" type="button" class="cursor-pointer text-sm font-semibold px-3 py-1.5 rounded-full border transition-colors" aria-pressed="false">Owned by me</button>
      </div>
      <p id="resultCount" class="mt-3 text-sm text-slate-600"></p>
      <div id="grid" class="mt-4 grid sm:grid-cols-2 gap-3"></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let ALL = [], LANG_NAMES = {};
      let FAVS = [];
      try { FAVS = JSON.parse(localStorage.getItem('tts_favs') || '[]'); } catch (e) {}
      let activeChip = 'all';
      const SAMPLE = { bn:'এটি একটি ভয়েস প্রিভিউ।', hi:'नमस्ते, यह एक आवाज़ पूर्वावलोकन है।', en:'Hello, this is a short voice preview.', es:'Hola, esta es una vista previa de voz.', fr:'Bonjour, voici un aperçu vocal.', de:'Hallo, hier ist eine Sprachvorschau.', ar:'مرحبا، هذه معاينة صوتية قصيرة.', ja:'こんにちは、これは音声プレビューです。', zh:'你好，这是一个简短的语音预览。', default:'Hello, this is a short voice preview.' };
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const genderLabel = (g) => (g === 'feminine') ? 'Female' : (g === 'masculine') ? 'Male' : (g === 'gender_neutral') ? 'Neutral' : 'High Profiled person';
      const copyText = (text, btn) => navigator.clipboard.writeText(text).then(() => { const o = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = o, 1400); }).catch(() => {});

      async function init() {
        try { const r = await fetch('/api/languages').then(x => x.json()); (r.languages || []).forEach(l => LANG_NAMES[l.code] = l.name); } catch (e) {}
        const lib = await fetch('/api/library').then(x => x.json());
        ALL = lib.voices || [];
        $('totalCount').textContent = ALL.length;
        populateFilters();
        render();
        ['search','fGender','fLang','fTag'].forEach(id => $(id).addEventListener('input', render));
        function applyTheme(dark) {
          document.documentElement.classList.toggle('dark', dark);
          $('iconMoon').classList.toggle('hidden', dark);
          $('iconSun').classList.toggle('hidden', !dark);
        }
        $('themeBtn').addEventListener('click', () => {
          const dark = !document.documentElement.classList.contains('dark');
          applyTheme(dark);
          try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
        });
        (function () {
          let saved = null;
          try { saved = localStorage.getItem('theme'); } catch (e) {}
          const dark = (saved === 'dark') || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
          applyTheme(dark);
        })();
      }

      function populateFilters() {
        const genders = ['All', ...Array.from(new Set(ALL.map(v => genderLabel(v.gender))))];
        const langs = ['All', ...Array.from(new Set(ALL.map(v => v.language))).sort()];
        const tags = ['All', ...Array.from(new Set(ALL.map(v => v.tag).filter(Boolean)))];
        const fill = (sel, vals) => { sel.innerHTML = ''; vals.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = (v === 'All') ? 'All' : (v === 'language' ? 'Language' : (LANG_NAMES[v] ? LANG_NAMES[v] + ' (' + v + ')' : v)); sel.appendChild(o); }); };
        fill($('fGender'), genders);
        fill($('fLang'), langs);
        fill($('fTag'), tags);
      }

      function render() {
        const q = $('search').value.trim().toLowerCase();
        const g = $('fGender').value, l = $('fLang').value, t = $('fTag').value;
        let rows = ALL.filter(v => {
          if (g !== 'All' && genderLabel(v.gender) !== g) return false;
          if (l !== 'All' && v.language !== l) return false;
          if (t !== 'All' && v.tag !== t) return false;
          if (activeChip === 'fav' && FAVS.indexOf(v.id) < 0) return false;
          if (activeChip === 'owned' && !v.owner) return false;
          if (q) {
            const hay = [v.name, v.id, v.description, v.language, v.tag, v.gender, v.mode, v.country].join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
        $('resultCount').textContent = rows.length + ' voice' + (rows.length === 1 ? '' : 's') + ' found';
        const grid = $('grid'); grid.innerHTML = '';
        rows.forEach(v => {
          const fav = FAVS.indexOf(v.id) >= 0;
          const owner = !!v.owner;
          const card = document.createElement('div');
          card.className = 'rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 flex flex-col gap-2';
          card.innerHTML =
            '<div class="flex items-start justify-between gap-3">' +
              '<div class="min-w-0">' +
                '<div class="flex items-center gap-1.5">' +
                  '<h3 class="font-semibold text-slate-800 dark:text-slate-100 truncate">' + esc(v.name) + '</h3>' +
                  (owner ? '<span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-cta-700 dark:text-cta-400 bg-cta-50 dark:bg-cta-600/15 px-1.5 py-0.5 rounded">Owned</span>' : '') +
                '</div>' +
                '<p class="mt-0.5 text-sm text-slate-600 dark:text-slate-400 line-clamp-2">' + esc(v.description || 'No description.') + '</p>' +
              '</div>' +
              '<button class="star shrink-0 w-8 h-8 grid place-items-center rounded-lg cursor-pointer transition-colors ' + (fav ? 'text-amber-500 hover:bg-amber-50 dark:hover:bg-slate-800' : 'text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800') + '" data-id="' + esc(v.id) + '" aria-label="Toggle favorite" aria-pressed="' + fav + '">' +
                '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="' + (fav ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 6.9 20.4l1.4-6.8L3.2 9l6.9-.7z" stroke-linejoin="round"/></svg>' +
              '</button>' +
            '</div>' +
            '<div class="flex flex-wrap gap-1.5">' +
              '<span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-[11px] font-medium text-slate-600 dark:text-slate-300">' + esc(genderLabel(v.gender)) + '</span>' +
              '<span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-[11px] font-medium text-slate-600 dark:text-slate-300">' + esc(LANG_NAMES[v.language] || v.language) + '</span>' +
              '<span class="px-2 py-0.5 rounded-full bg-cta-50 dark:bg-cta-600/15 text-[11px] font-medium text-cta-700 dark:text-cta-400">' + esc(v.tag) + '</span>' +
            '</div>' +
            '<div class="flex items-center justify-between gap-2">' +
              '<code class="text-[11px] font-mono text-slate-600 break-all">' + esc(v.id) + '</code>' +
              '<div class="flex items-center gap-1 shrink-0">' +
                '<button class="copy-id inline-flex items-center gap-1 text-xs font-semibold text-brand-600 dark:text-brand-300 hover:text-brand-700 px-2 py-1 rounded-lg hover:bg-brand-50 dark:hover:bg-slate-800 cursor-pointer" data-id="' + esc(v.id) + '">Copy ID</button>' +
                '<button class="preview inline-flex items-center gap-1 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:text-brand-600 px-2 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer" data-id="' + esc(v.id) + '" data-lang="' + esc(v.language) + '" aria-label="Preview voice"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Preview</button>' +
              '</div>' +
            '</div>' +
            '<audio class="hidden prev-audio"></audio>';
          grid.appendChild(card);
        });
      }

      // ---- Favorites, Owned filter, voice preview ----
      function saveFavs() { try { localStorage.setItem('tts_favs', JSON.stringify(FAVS)); } catch (e) {} }
      function toggleFav(id) { const i = FAVS.indexOf(id); if (i >= 0) FAVS.splice(i, 1); else FAVS.push(id); saveFavs(); }
      function setChip(c) {
        activeChip = c;
        const map = { all: 'chipAll', fav: 'chipFav', owned: 'chipOwned' };
        Object.keys(map).forEach(k => {
          const on = (k === c);
          const el = $(map[k]);
          el.setAttribute('aria-pressed', String(on));
          el.className = 'cursor-pointer text-sm font-semibold px-3 py-1.5 rounded-full border transition-colors ' +
            (on ? 'bg-brand-600 text-white border-brand-600' : 'text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800');
        });
        render();
      }
      async function previewVoice(id, lang, btn) {
        if (btn._busy) return;
        btn._busy = true;
        const sample = SAMPLE[lang] || SAMPLE['default'];
        const orig = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
        try {
          const res = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ language: lang, model: 'sonic-3.5', voice_id: id, text: sample, format: 'mp3' }) });
          if (!res.ok) throw new Error('preview');
          const blob = await res.blob();
          const card = btn.closest('.rounded-2xl');
          const au = card.querySelector('.prev-audio');
          document.querySelectorAll('.prev-audio').forEach(o => { if (o !== au) o.pause(); });
          au.src = URL.createObjectURL(blob);
          au.play();
        } catch (e) {}
        finally { btn.disabled = false; btn.innerHTML = orig; btn._busy = false; }
      }
      $('grid').addEventListener('click', (e) => {
        const star = e.target.closest('.star');
        if (star) {
          const id = star.dataset.id;
          toggleFav(id);
          const on = FAVS.indexOf(id) >= 0;
          star.setAttribute('aria-pressed', String(on));
          star.classList.toggle('text-amber-500', on);
          star.classList.toggle('text-slate-400', !on);
          star.querySelector('svg').setAttribute('fill', on ? 'currentColor' : 'none');
          if (activeChip === 'fav' && !on) { const card = star.closest('.rounded-2xl'); if (card) card.remove(); }
          else render();
          return;
        }
        const copy = e.target.closest('.copy-id');
        if (copy) { copyText(copy.dataset.id, copy); return; }
        const prev = e.target.closest('.preview');
        if (prev) { previewVoice(prev.dataset.id, prev.dataset.lang, prev); return; }
      });
      ['chipAll', 'chipFav', 'chipOwned'].forEach(id => $(id).addEventListener('click', () => setChip(id === 'chipFav' ? 'fav' : id === 'chipOwned' ? 'owned' : 'all')));
      setChip('all');

      init();
    </script>
  </body>
</html>
